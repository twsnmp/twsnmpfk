title: Cron Job Created or Modified
id: f45691ea-2719-4822-ba35-ef05b827e801
status: stable
description: Detects creation or modification of cron scheduled jobs, frequently used for persistence on Linux systems.
author: twlogeye
date: 2026-09-09
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1053.003
logsource:
    product: linux
    category: cron
detection:
    selection:
        content|contains:
            - 'REPLACE ('
            - 'crontab['
            - '/etc/crontab'
            - '/etc/cron.d/'
    condition: selection
falsepositives:
    - Legitimate user or package installation of scheduled tasks
level: low
