title: BITSAdmin File Transfer Execution
id: dae81400-f1c7-43a9-a4a7-8f551b9423c1
status: stable
description: Detects the usage of bitsadmin.exe to download files or create persistence transfer jobs.
author: twlogeye
date: 2026-09-09
tags:
    - attack.defense_evasion
    - attack.persistence
    - attack.t1197
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        EventID: 4688
        CommandLine|contains:
            - 'bitsadmin'
        CommandLine|contains|all:
            - '/transfer'
    condition: selection
falsepositives:
    - Legacy installation or update scripts
level: medium
