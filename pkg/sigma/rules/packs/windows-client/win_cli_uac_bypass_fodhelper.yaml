title: UAC Bypass Via Fodhelper
id: 71b3e839-a9a7-47bf-8f2c-5695847e0901
status: stable
description: Detects execution of fodhelper.exe which is frequently abused to bypass User Account Control (UAC).
author: twlogeye
date: 2026-09-09
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
