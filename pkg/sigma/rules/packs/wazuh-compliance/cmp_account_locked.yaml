title: 'pam: User account locked due to excessive authentication failures'
id: wazuh-cmp-account-locked
status: stable
description: 'User account was locked out by pam_faillock or pam_tally2 after consecutive login failures (PCI-DSS 8.1.6, NIST AC-7, CIS 6.2)'
author: Wazuh Ruleset / twlogeye converter
date: '2026-09-09'
tags:
    - attack.t1110
    - wazuh
    - pci_dss.8.1.6
    - pci_dss.10.2.5
    - nist_800_53.ac_7
    - cis.control_6_2
logsource:
    product: linux
    service: pam
detection:
    selection:
        content|contains:
            - 'Consecutive login failures'
            - 'Account locked'
            - 'user has been locked'
            - 'faillock: Consecutive login failures'
    condition: selection
level: high
